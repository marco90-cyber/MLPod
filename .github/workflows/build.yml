name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compila APK (release)
        run: gradle :app:assembleRelease --stacktrace

      - name: Rinomina APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/MLPod-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MLPod-apk
          path: dist/*.apk

      - name: Crea release con l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MLPod 1.0.${{ github.run_number }}
          files: dist/*.apk
